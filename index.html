<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B2 ESL Listening Lab - Short Stories</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      text-align: center;
      margin-bottom: 0.5rem;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 0.4rem;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 0.75rem 1.25rem;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .btn {
      background-color: var(--accent);
      color: #0f172a;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn:hover:not(:disabled) {
      background-color: var(--accent-hover);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-secondary {
      background-color: #334155;
      color: var(--text);
    }

    .btn-secondary:hover:not(:disabled) {
      background-color: #475569;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .audio-section {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      background: rgba(15, 23, 42, 0.6);
      padding: 1rem;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    audio {
      width: 100%;
      height: 42px;
    }

    .script-box {
      background: rgba(15, 23, 42, 0.4);
      border: 1px dashed var(--border);
      border-radius: 10px;
      padding: 1rem;
      line-height: 1.7;
      color: #cbd5e1;
      display: none;
      white-space: pre-line;
      font-size: 0.95rem;
    }

    .script-box.visible {
      display: block;
    }

    .question-section {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .question-title {
      font-weight: 600;
      font-size: 1.1rem;
      color: var(--text);
    }

    textarea {
      width: 100%;
      min-height: 90px;
      background-color: #0f172a;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.85rem;
      color: var(--text);
      font-size: 1rem;
      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: var(--accent);
    }

      display: none;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid var(--success);
