<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B2 Oral Fluency & Listening Simulation</title>
  <style>
    :root {
      --bg: #0b1329;
      --card-bg: #152238;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --border: #233554;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    header {
      text-align: center;
      margin-bottom: 0.25rem;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 0.3rem;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .dashboard-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 0.75rem 1.25rem;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .chips-container {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .chip {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      background: #1e293b;
      color: var(--text-muted);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    .chip:hover {
      background: #334155;
    }

    .chip.active {
      background: var(--accent);
      color: #0b1329;
      border-color: var(--accent);
    }

    .score-badge {
      background: #0f172a;
      padding: 0.4rem 0.9rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-weight: 700;
      color: var(--accent);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .audio-control-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.9rem;
      background: rgba(11, 19, 41, 0.7);
      padding: 1.2rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      text-align: center;
    }

    audio {
      width: 100%;
      max-width: 500px;
      height: 42px;
      outline: none;
      margin-top: 0.3rem;
    }

    .tag-title {
      font-size: 0.82rem;
      color: var(--accent);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .oral-zone {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.9rem;
      background: rgba(11, 19, 41, 0.6);
      padding: 1.5rem;
      border-radius: 14px;
      border: 2px dashed var(--border);
      text-align: center;
    }

    .mic-button {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      background: #1e293b;
      border: 3px solid var(--accent);
      color: var(--accent);
      font-size: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.25s ease;
      user-select: none;
    }

    .mic-button.recording {
      background: var(--danger);
      border-color: #fca5a5;
      color: white;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { transform: scale(1.08); box-shadow: 0 0 0 14px rgba(239, 68, 68, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .speech-box {
      width: 100%;
      min-height: 55px;
      background: #0b1329;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.9rem;
      color: #e2e8f0;
      font-size: 1.05rem;
      font-style: italic;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .btn {
      background-color: var(--accent);
      color: #0b1329;
      border: none;
      padding: 0.65rem 1.3rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn:hover:not(:disabled) {
      background-color: var(--accent-hover);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-secondary {
      background-color: #1e293b;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover:not(:disabled) {
      background-color: #334155;
    }

    .eval-box {
      display: none;
      padding: 1.2rem;
      background: #0b1329;
      border-radius: 12px;
      border: 1px solid var(--border);
      flex-direction: column;
      gap: 0.75rem;
      text-align: left;
    }

    .eval-box.visible {
      display: flex;
    }

    .eval-badge {
      display: inline-block;
      align-self: flex-start;
      padding: 0.35rem 0.8rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .eval-success {
      background: rgba(34, 197, 94, 0.2);
      color: var(--success);
      border: 1px solid var(--success);
    }

    .eval-danger {
      background: rgba(239, 68, 68, 0.2);
      color: var(--danger);
      border: 1px solid var(--danger);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>B2 Oral Fluency & Listening Simulation</h1>
      <p class="subtitle">Listen carefully, answer the question orally, and check your response.</p>
    </header>

    <div class="dashboard-bar">
      <div class="chips-container" id="chipsNav"></div>
      <div class="score-badge" id="caseIndicator">Case 1 / 10</div>
    </div>

    <div class="card">
      <div class="audio-control-card">
        <span class="tag-title">Listening Audio Track</span>
        <h3 id="scenarioTitle">Loading scenario...</h3>
        <audio id="audioPlayer" controls preload="metadata"></audio>
      </div>

      <div class="oral-zone">
        <span class="tag-title">Listening Question</span>
        <h2 id="promptQuestion" style="font-size: 1.15rem; color: #fff;">...</h2>
        <div class="mic-button" id="micBtn" title="Click to speak">🎤</div>
        <span id="micStatus" style="font-size: 0.88rem; color: var(--text-muted);">Click the microphone to record your answer</span>
        <div class="speech-box" id="transcriptDisplay">Your spoken response will appear here...</div>
        <button class="btn" id="evaluateBtn" disabled>Evaluate Response</button>
      </div>

      <div class="eval-box" id="evalBox">
        <span class="eval-badge" id="evalBadge">Evaluation Result</span>
        <p id="evalFeedback" style="font-size: 0.95rem; line-height: 1.5;"></p>
        <div style="display: flex; justify-content: flex-end; margin-top: 0.5rem;">
          <button class="btn btn-secondary" id="nextCaseBtn">Next Case &rarr;</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SIM_CASES = [
      {
        id: 1,
        title: "1. The Forgotten Recipe",
        file: "1. The Forgotten Recipe.mp3",
        prompt: "According to the speaker, what is the secret addition to the cake?",
        acceptedAnswers: ["egg", "an egg", "extra egg", "an extra egg", "coffee", "instant coffee", "spoonful of coffee", "spoonful of instant coffee", "honey", "spoon of honey"],
        expectedDisplay: "An extra egg and a spoonful of instant coffee (or honey)"
      },
      {
        id: 2,
        title: "2. The Late Train",
        file: "2. The Late Train.mp3",
        prompt: "What language does the speaker claim to be fluent in on their resume?",
        acceptedAnswers: ["french", "french language", "fluent in french"],
        expectedDisplay: "French"
      },
      {
        id: 3,
        title: "3. The Art Auction",
        file: "3. The Art Auction.mp3",
        prompt: "What color was the umbrella held by the woman at the station?",
        acceptedAnswers: ["yellow", "bright yellow", "yellow umbrella"],
        expectedDisplay: "Yellow"
      },
      {
        id: 4,
        title: "4. The Mountain Path",
        file: "4. The Mountain Path.mp3",
        prompt: "How did the speaker describe their current emotional state regarding the relationship?",
        acceptedAnswers: ["exhausted", "tired", "not angry", "drained"],
        expectedDisplay: "Exhausted (not even angry anymore)"
      },
      {
        id: 5,
        title: "5. The Computer Problem",
        file: "5. The Computer Problem.mp3",
        prompt: "What animal did the speaker's battle cry sound like?",
        acceptedAnswers: ["seagull", "startled seagull", "sea gull", "a seagull"],
        expectedDisplay: "A startled seagull"
      },
      {
        id: 6,
        title: "6. The Old Watch",
        file: "6. The Old Watch.mp3",
        prompt: "How many years ago was the metal box buried in the backyard?",
        acceptedAnswers: ["twenty", "20", "twenty years", "20 years"],
        expectedDisplay: "Twenty years ago"
      },
      {
        id: 7,
        title: "7. The Forest Plant",
        file: "7. The Forest Plant.mp3",
        prompt: "Where does the speaker keep the secret flash drive hidden?",
        acceptedAnswers: ["desk drawer", "underneath my desk drawer", "under the drawer", "desk", "drawer", "under desk"],
        expectedDisplay: "Underneath the desk drawer"
      },
      {
        id: 8,
        title: "8. The Hot Coffee",
        file: "8. The Hot Coffee.mp3",
        prompt: "What drink did the speaker mention people sip in quiet alleys?",
        acceptedAnswers: ["espresso", "coffee", "cup of espresso"],
        expectedDisplay: "Espresso"
      },
      {
        id: 9,
        title: "9. The Missing Suitcase",
        file: "9. The Missing Suitcase.mp3",
        prompt: "Where did the speaker accidentally end up after taking the wrong train?",
        acceptedAnswers: ["village", "tiny village", "a tiny village", "small village"],
        expectedDisplay: "A tiny village"
      },
      {
        id: 10,
        title: "10. The Terrace Garden",
        file: "10. The Terrace Garden.mp3",
        prompt: "What was the speaker afraid of when they walked away in the past?",
        acceptedAnswers: ["failing", "failure", "terrified of failing", "to fail"],
        expectedDisplay: "Failing"
      }
    ];

    let currentCaseIdx = 0;
    let isRecording = false;
    let recognition = null;
    let fullTranscript = "";

    const audioPlayer = document.getElementById("audioPlayer");
    const scenarioTitle = document.getElementById("scenarioTitle");
    const promptQuestion = document.getElementById("promptQuestion");
    const micBtn = document.getElementById("micBtn");
    const micStatus = document.getElementById("micStatus");
    const transcriptDisplay = document.getElementById("transcriptDisplay");
    const evaluateBtn = document.getElementById("evaluateBtn");
    const evalBox = document.getElementById("evalBox");
    const evalBadge = document.getElementById("evalBadge");
    const evalFeedback = document.getElementById("evalFeedback");
    const nextCaseBtn = document.getElementById("nextCaseBtn");
    const caseIndicator = document.getElementById("caseIndicator");
    const chipsNav = document.getElementById("chipsNav");

    // Limpieza de caracteres para comparaciones directas
    function normalizeString(str) {
      return str
        .toLowerCase()
        .replace(/[.,/#!$%^&*;:{}=\-_`~()]/g, "")
        .replace(/\s+/g, " ")
        .trim();
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = "en-US";

      recognition.onresult = (event) => {
        let interim = "";
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            fullTranscript += " " + event.results[i][0].transcript;
          } else {
            interim += event.results[i][0].transcript;
          }
        }
        const textToShow = (fullTranscript + " " + interim).trim();
        transcriptDisplay.textContent = textToShow || "Listening...";
        if (textToShow.length > 0) {
          evaluateBtn.disabled = false;
        }
      };

      recognition.onerror = (e) => {
        micStatus.textContent = "Microphone status: " + e.error;
        stopRecording();
      };
    } else {
      micStatus.textContent = "Speech recognition is not supported in this browser. Please use Chrome or Edge.";
      micBtn.style.opacity = "0.5";
      micBtn.style.cursor = "not-allowed";
    }

    micBtn.addEventListener("click", () => {
      if (!recognition) return;
      if (!isRecording) startRecording();
      else stopRecording();
    });

    function startRecording() {
      fullTranscript = "";
      transcriptDisplay.textContent = "Listening to your response...";
      try {
        recognition.start();
        isRecording = true;
        micBtn.classList.add("recording");
        micStatus.textContent = "Recording... Click again when finished.";
      } catch (err) {
        console.error(err);
      }
    }

    function stopRecording() {
      if (!isRecording) return;
      recognition.stop();
      isRecording = false;
      micBtn.classList.remove("recording");
      micStatus.textContent = "Recording stopped. Click Evaluate to verify your answer.";
    }

    evaluateBtn.addEventListener("click", () => {
      stopRecording();
      const rawStudentText = fullTranscript.trim() || transcriptDisplay.textContent.trim();
      const studentClean = normalizeString(rawStudentText);
      const current = SIM_CASES[currentCaseIdx];

      // Verificación directa: comprueba si alguna palabra/frase aceptada coincide
      const isCorrect = current.acceptedAnswers.some(ans => {
        const cleanAns = normalizeString(ans);
        return studentClean.includes(cleanAns) || cleanAns.includes(studentClean);
      });

      evalBox.classList.add("visible");
      if (isCorrect) {
        evalBadge.className = "eval-badge eval-success";
        evalBadge.textContent = "Correct (100%)";
        evalFeedback.innerHTML = `<strong>Great job!</strong> Your answer was recognized correctly.<br>Expected: <em>${current.expectedDisplay}</em>.`;
      } else {
        evalBadge.className = "eval-badge eval-danger";
        evalBadge.textContent = "Incorrect";
        evalFeedback.innerHTML = `Your response (<em>"${rawStudentText}"</em>) did not match the key information.<br>Expected: <strong>${current.expectedDisplay}</strong>.`;
      }
    });

    nextCaseBtn.addEventListener("click", () => {
      if (currentCaseIdx < SIM_CASES.length - 1) loadCase(currentCaseIdx + 1);
      else alert("Simulation completed! Well done.");
    });

    function loadCase(idx) {
      if (isRecording) stopRecording();
      currentCaseIdx = idx;
      const data = SIM_CASES[currentCaseIdx];

      scenarioTitle.textContent = data.title;
      promptQuestion.textContent = data.prompt;
      caseIndicator.textContent = `Case ${data.id} / ${SIM_CASES.length}`;

      audioPlayer.src = encodeURI(data.file);
      audioPlayer.load();

      fullTranscript = "";
      transcriptDisplay.textContent = "Your spoken response will appear here...";
      evaluateBtn.disabled = true;
      evalBox.classList.remove("visible");
      micStatus.textContent = "Click the microphone to record your answer";

      updateChips();
    }

    function buildChips() {
      chipsNav.innerHTML = "";
      SIM_CASES.forEach((c, i) => {
        const chip = document.createElement("div");
        chip.className = "chip";
        chip.textContent = c.id;
        chip.addEventListener("click", () => loadCase(i));
        chipsNav.appendChild(chip);
      });
    }

    function updateChips() {
      const chips = document.querySelectorAll(".chip");
      chips.forEach((ch, i) => {
        if (i === currentCaseIdx) ch.classList.add("active");
        else ch.classList.remove("active");
      });
    }

    buildChips();
    loadCase(0);
  </script>
</body>
</html>
