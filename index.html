<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B2 ESL Listening Lab - Short Stories</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --warning: #f59e0b;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      text-align: center;
      margin-bottom: 0.5rem;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 0.4rem;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 0.75rem 1.25rem;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .btn {
      background-color: var(--accent);
      color: #0f172a;
      border: none;
      padding: 0.55rem 1.1rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn:hover:not(:disabled) {
      background-color: var(--accent-hover);
      transform: translateY(-1px);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-secondary {
      background-color: #334155;
      color: var(--text);
    }

    .btn-secondary:hover:not(:disabled) {
      background-color: #475569;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }

    .audio-section {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      background: rgba(15, 23, 42, 0.7);
      padding: 1.2rem;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .instruction-tag {
      font-size: 0.85rem;
      color: var(--accent);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    audio {
      width: 100%;
      height: 42px;
      outline: none;
    }

    .script-box {
      background: rgba(15, 23, 42, 0.4);
      border: 1px dashed var(--border);
      border-radius: 10px;
      padding: 1rem;
      line-height: 1.7;
      color: #cbd5e1;
      display: none;
      white-space: pre-line;
      font-size: 0.95rem;
    }

    .script-box.visible {
      display: block;
    }

    .question-section {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .question-title {
      font-weight: 600;
      font-size: 1.05rem;
      color: var(--text);
      line-height: 1.4;
    }

    textarea {
      width: 100%;
      min-height: 95px;
      background-color: #0f172a;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.85rem;
      color: var(--text);
      font-size: 1rem;
      resize: vertical;
      outline: none;
      line-height: 1.5;
    }

    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
    }

    .eval-box {
      display: none;
      padding: 1.2rem;
      border-radius: 12px;
      line-height: 1.6;
      font-size: 0.95rem;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .eval-box.show {
      display: block;
    }

    .eval-correct {
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid var(--success);
    }

    .eval-partial {
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid var(--warning);
    }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }

    .badge-correct {
      background: var(--success);
      color: #0f172a;
    }

    .badge-partial {
      background: var(--warning);
      color: #0f172a;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>B2 Listening Discrimination Lab</h1>
      <p class="subtitle">Listen to the story and the question spoken at the end. Answer below.</p>
    </header>

    <div class="nav-bar">
      <button class="btn btn-secondary" id="prev-btn">Previous</button>
      <span id="story-counter" style="font-weight: 600;">Story 1 of 10</span>
      <button class="btn btn-secondary" id="next-btn">Next</button>
    </div>

    <div class="card">
      <h2 id="story-title" style="color: var(--accent);">1. The Forgotten Recipe</h2>

      <div class="audio-section">
        <span class="instruction-tag">🎧 Listen carefully (story + final question):</span>
        <audio id="audio-player" controls preload="auto">
          <source id="audio-src" src="1. The Forgotten Recipe.mp3" type="audio/mpeg">
          Your browser does not support the audio element.
        </audio>
      </div>

      <div>
        <button class="btn btn-secondary" id="toggle-script-btn" style="font-size: 0.85rem;">
          Show Script
        </button>
        <div id="script-container" class="script-box" style="margin-top: 0.75rem;"></div>
      </div>

      <div class="question-section">
        <p class="question-title" id="question-text">Audio Question: Listen to the speaker at the end of the track to hear the question.</p>
        <textarea id="student-answer" placeholder="Type your answer in English based on what you heard..."></textarea>
        <div style="display: flex; gap: 0.6rem; align-items: center;">
          <button class="btn" id="check-btn">Evaluate Answer</button>
          <button class="btn btn-secondary" id="reset-btn">Clear</button>
        </div>
      </div>

      <div id="evaluation-card" class="eval-box">
        <span id="eval-badge" class="badge"></span>
        <p id="eval-message" style="margin-bottom: 0.5rem;"></p>
        <p style="color: #cbd5e1;"><strong>Model Answer:</strong> <span id="model-answer" style="color: #f8fafc;"></span></p>
      </div>
    </div>
  </div>

  <script>
    const stories = [
      {
        id: 1,
        title: "1. The Forgotten Recipe",
        audio: "1. The Forgotten Recipe.mp3",
        script: "Julian spent hours trying to bake his grandmother’s favorite lemon cake.\nEvery cake he made failed because something was missing from the written recipe.\nWhile cleaning the kitchen cupboard, he found a tiny note hidden behind a jar.\nIt said: always add a spoonful of honey before putting the tray in the oven.\nThat small secret made the cake taste just like the one from his childhood.\n\nQuestion: What missing ingredient helped Julian successfully recreate his grandmother's cake?",
        question: "What missing ingredient helped Julian successfully recreate his grandmother's cake?",
        keywords: ["honey", "spoonful"],
        model: "A spoonful of honey."
      },
      {
        id: 2,
        title: "2. The Late Train",
        audio: "2. The Late Train.mp3",
        script: "Elena ran as fast as she could toward the platform to catch the train.\nThe doors started to close, but she quickly put her backpack between them.\nThe automatic doors opened again, and she walked in and sat down to rest.\nWhen she looked out the window, she checked the digital screen above her seat.\nShe was relieved to see she was on the right train going home.\n\nQuestion: How did Elena stop the train doors from closing so she could get on?",
        question: "How did Elena stop the train doors from closing so she could get on?",
        keywords: ["backpack", "bag", "between"],
        model: "She put her backpack between the closing doors."
      },
      {
        id: 3,
        title: "3. The Art Auction",
        audio: "3. The Art Auction.mp3",
        script: "Marcus held his bidder card in his hand while the price kept going up.\nHe had loved the blue painting since the moment he saw it in the catalog.\nTwo other buyers made high offers, but Marcus was determined to win today.\nHe raised his card one last time right before the seller closed the sale.\nThe wooden hammer hit the table, and the painting officially belonged to him.\n\nQuestion: Why was Marcus willing to make high offers during the auction?",
        question: "Why was Marcus willing to make high offers during the auction?",
        keywords: ["loved", "blue painting", "catalog", "determined"],
        model: "Because he loved the blue painting since seeing it in the catalog and was determined to win."
      },
      {
        id: 4,
        title: "4. The Mountain Path",
        audio: "4. The Mountain Path.mp3",
        script: "Lucas followed the trail up the mountain, but dark clouds brought thick gray fog.\nHe could only see a few steps in front of him on the rocky ground.\nInstead of running, he stopped and checked the compass on his phone carefully.\nAfter walking slowly for ten minutes, he reached a flat wooden bridge over a river.\nOn the other side, the warm lights of the cabin guided him safely inside.\n\nQuestion: What tool helped Lucas find his way when the fog covered the path?",
        question: "What tool helped Lucas find his way when the fog covered the path?",
        keywords: ["compass", "phone"],
        model: "The compass on his phone."
      },
      {
        id: 5,
        title: "5. The Computer Problem",
        audio: "5. The Computer Problem.mp3",
        script: "Sofia worked late into the night trying to fix a bug in the store website.\nCustomers could not finish their orders because the pay button stopped working.\nShe read the computer code line by line until she saw a missing comma.\nOnce she added the symbol and saved the file, she tested the page again.\nThe payment system worked instantly, and the orders went through without issues.\n\nQuestion: What specific error in the code was causing the checkout system to fail?",
        question: "What specific error in the code was causing the checkout system to fail?",
        keywords: ["comma", "missing comma"],
        model: "A missing comma in the code."
      },
      {
        id: 6,
        title: "6. The Old Watch",
        audio: "6. The Old Watch.mp3",
        script: "David found an old silver watch in his grandfather’s desk that no longer worked.\nThe local repair shop told him it was too old and could not be fixed.\nDavid opened the back of the watch at home using small tools and a bright lamp.\nHe removed a tiny piece of dust trapped between two of the metal wheels.\nImmediately, the small hands started moving smoothly around the numbers again.\n\nQuestion: What was stopping the watch's internal wheels from turning?",
        question: "What was stopping the watch's internal wheels from turning?",
        keywords: ["dust", "piece of dust", "metal wheels"],
        model: "A tiny piece of dust trapped between two metal wheels."
      },
      {
        id: 7,
        title: "7. The Forest Plant",
        audio: "7. The Forest Plant.mp3",
        script: "Dr. Alvarez walked through the wet forest for weeks searching for rare flowers.\nHer trip was almost over, and she had not discovered anything new yet.\nWhile resting under a big tree during the rain, she saw a bright purple petal.\nIt was a wild flower that scientists believed had disappeared many years ago.\nShe took photos and notes, happy to have found proof that it still lived.\n\nQuestion: Why was finding the purple flower so significant for Dr. Alvarez?",
        question: "Why was finding the purple flower so significant for Dr. Alvarez?",
        keywords: ["disappeared", "extinct", "proof", "still lived"],
        model: "Because scientists believed it had disappeared many years ago, proving it still existed."
      },
      {
        id: 8,
        title: "8. The Hot Coffee",
        audio: "8. The Hot Coffee.mp3",
        script: "Clara dropped her paper cup, spilling black coffee all over her printed report.\nHer boss was waiting in the meeting room, and the presentation started in five minutes.\nShe stayed calm, left the dirty papers behind, and brought her tablet instead.\nShe explained her plan with confidence, showing pictures and numbers on the screen.\nThe team liked her clear ideas so much that they approved the project right away.\n\nQuestion: How did Clara deliver her presentation after ruining her printed notes?",
        question: "How did Clara deliver her presentation after ruining her printed notes?",
        keywords: ["tablet", "screen"],
        model: "She brought her tablet to show pictures and numbers on the screen."
      },
      {
        id: 9,
        title: "9. The Missing Suitcase",
        audio: "9. The Missing Suitcase.mp3",
        script: "Mateo landed in Rome, but the airport staff said his suitcase was still in London.\nHe had an important job interview the next morning and only had his travel clothes.\nHe walked to a small shop nearby and bought a simple white shirt and black trousers.\nHe arrived at the office early, looking neat and ready to answer every question.\nThe interview went so well that the company offered him the job that afternoon.\n\nQuestion: How did Mateo solve the problem of not having proper clothes for his interview?",
        question: "How did Mateo solve the problem of not having proper clothes for his interview?",
        keywords: ["bought", "shirt", "trousers", "clothes", "shop"],
        model: "He bought a simple white shirt and black trousers at a nearby shop."
      },
      {
        id: 10,
        title: "10. The Terrace Garden",
        audio: "10. The Terrace Garden.mp3",
        script: "Nora wanted to grow fresh vegetables on the empty roof of her building.\nThe strong sun and wind often dried the plants before they could grow tall.\nShe built a simple watering system using plastic bottles and long pieces of string.\nThe soil stayed moist, and green leaves soon covered the wooden boxes.\nBy the end of summer, she was picking fresh red tomatoes every morning.\n\nQuestion: What materials did Nora use to build her rooftop watering system?",
        question: "What materials did Nora use to build her rooftop watering system?",
        keywords: ["bottles", "string", "plastic bottles"],
        model: "Plastic bottles and long pieces of string."
      }
    ];

    let currentIndex = 0;

    document.addEventListener("DOMContentLoaded", () => {
      const storyTitle = document.getElementById('story-title');
      const storyCounter = document.getElementById('story-counter');
      const questionText = document.getElementById('question-text');
      const scriptContainer = document.getElementById('script-container');
      const modelAnswer = document.getElementById('model-answer');
      const audioPlayer = document.getElementById('audio-player');
      const audioSrc = document.getElementById('audio-src');
      const studentAnswer = document.getElementById('student-answer');
      const evalCard = document.getElementById('evaluation-card');
      const evalBadge = document.getElementById('eval-badge');
      const evalMsg = document.getElementById('eval-message');
      const toggleScriptBtn = document.getElementById('toggle-script-btn');
      const prevBtn = document.getElementById('prev-btn');
      const nextBtn = document.getElementById('next-btn');
      const checkBtn = document.getElementById('check-btn');
      const resetBtn = document.getElementById('reset-btn');

      function renderStory() {
        const story = stories[currentIndex];
        storyCounter.innerText = `Story ${currentIndex + 1} of ${stories.length}`;
        storyTitle.innerText = story.title;
        questionText.innerText = "Audio Question: Listen to the question at the end of the track.";
        scriptContainer.innerText = story.script;
        modelAnswer.innerText = story.model;

        // Cargar audio codificado para evitar errores con espacios
        audioSrc.src = encodeURI(story.audio);
        audioPlayer.load();

        // Reiniciar estados
        studentAnswer.value = "";
        evalCard.className = "eval-box";
        scriptContainer.classList.remove('visible');
        toggleScriptBtn.innerText = "Show Script";

        prevBtn.disabled = currentIndex === 0;
        nextBtn.disabled = currentIndex === stories.length - 1;
      }

      toggleScriptBtn.addEventListener("click", () => {
        if (scriptContainer.classList.contains('visible')) {
          scriptContainer.classList.remove('visible');
          toggleScriptBtn.innerText = "Show Script";
        } else {
          scriptContainer.classList.add('visible');
          toggleScriptBtn.innerText = "Hide Script";
        }
      });

      checkBtn.addEventListener("click", () => {
        const input = studentAnswer.value.trim().toLowerCase();
        if (!input) {
          alert("Please type your answer in English before evaluating.");
          return;
        }

        const current = stories[currentIndex];
        // Comprobar si contiene las palabras clave esperadas
        const matches = current.keywords.filter(kw => input.includes(kw.toLowerCase()));

        evalCard.className = "eval-box show";
        if (matches.length > 0) {
          evalCard.classList.add("eval-correct");
          evalBadge.className = "badge badge-correct";
          evalBadge.innerText = "Well Done!";
          evalMsg.innerHTML = "Your answer captures the key information from the audio.";
        } else {
          evalCard.classList.add("eval-partial");
          evalBadge.className = "badge badge-partial";
          evalBadge.innerText = "Review & Compare";
          evalMsg.innerHTML = "Check your answer against the model below to see what key detail was expected.";
        }

        // Mostrar la pregunta escrita solo después de que el alumno ya intentó responder
        questionText.innerText = "Spoken Question: " + current.question;
      });

      resetBtn.addEventListener("click", () => {
        studentAnswer.value = "";
        evalCard.className = "eval-box";
      });

      nextBtn.addEventListener("click", () => {
        if (currentIndex < stories.length - 1) {
          currentIndex++;
          renderStory();
        }
      });

      prevBtn.addEventListener("click", () => {
        if (currentIndex > 0) {
          currentIndex--;
          renderStory();
        }
      });

      renderStory();
    });
  </script>
</body>
</html>
