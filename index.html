<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B2 Oral Fluency & Listening Simulation</title>
  <style>
    :root {
      --bg: #0b1329;
      --card-bg: #152238;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --border: #233554;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .start-overlay {
      position: fixed;
      inset: 0;
      background: rgba(11, 19, 41, 0.96);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 1.5rem;
    }

    .start-modal {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.2rem;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 20px 30px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    header {
      text-align: center;
      margin-bottom: 0.25rem;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 0.3rem;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .dashboard-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 0.75rem 1.25rem;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .score-badge {
      background: #0f172a;
      padding: 0.4rem 0.9rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-weight: 700;
      color: var(--accent);
    }

    .btn {
      background-color: var(--accent);
      color: #0b1329;
      border: none;
      padding: 0.65rem 1.3rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn:hover:not(:disabled) {
      background-color: var(--accent-hover);
      transform: translateY(-1px);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background-color: #1e293b;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover:not(:disabled) {
      background-color: #334155;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .audio-control-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.8rem;
      background: rgba(11, 19, 41, 0.7);
      padding: 1.2rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      text-align: center;
    }

    .audio-progress-bar {
      width: 100%;
      height: 8px;
      background: #0f172a;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 0.2rem;
    }

    .audio-progress-fill {
      width: 0%;
      height: 100%;
      background: var(--accent);
      transition: width 0.1s linear;
    }

    .tag-title {
      font-size: 0.82rem;
      color: var(--accent);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .oral-zone {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.9rem;
      background: rgba(11, 19, 41, 0.6);
      padding: 1.5rem;
      border-radius: 14px;
      border: 2px dashed var(--border);
      text-align: center;
    }

    .mic-button {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      background: #1e293b;
      border: 3px solid var(--accent);
      color: var(--accent);
      font-size: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.25s ease;
      user-select: none;
    }

    .mic-button.recording {
      background: var(--danger);
      border-color: #fca5a5;
      color: white;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { transform: scale(1.08); box-shadow: 0 0 0 14px rgba(239, 68, 68, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .speech-box {
      width: 100%;
      min-height: 55px;
      background: #0b1329;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.9rem;
      color: #e2e8f0;
      font-size: 1.05rem;
      font-style: italic;
      display: flex;
      align-items: center;
      justify-content: center;
    }
